name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]   # runs once a day
  workflow_dispatch:                 # adds a manual "Run workflow" button
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Arnav-Code-hub
          template: classic
          config_display: large
          config_timezone: Asia/Kolkata      # change if you're in a different timezone
          base: header, activity, community, repositories, metadata

          # 3D contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Coding habits (commits per hour / per day)
          plugin_habits: yes
          plugin_habits_charts: no
          plugin_habits_days: 14

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 8

          # Achievements (replaces the trophy card)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # Mastered technologies (icons from topics you've starred)
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0

          # Recent activity feed
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          # Lines of code added / removed
          plugin_lines: yes

          # Notable contributions (repos you've contributed to)
          plugin_notable: yes

          # Sekiro colours: crimson headings, gold icons
          extras_css: |
            h2, h2 a, h2.field, .field a { color: #E02424 !important; }
            h2 svg, .field svg { fill: #C9A227 !important; }
