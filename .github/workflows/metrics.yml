name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]   # runs once a day
  workflow_dispatch:                 # adds a manual "Run workflow" button
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Arnav-Code-hub
          template: classic
          config_display: large
          config_timezone: Asia/Kolkata      # change if you're in a different timezone
          base: header, activity, community, repositories, metadata

          # 3D contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits (commits per hour / per day)
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 8

          # Mastered technologies (icons from topics you've starred)
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
