name: Snake
on:
  schedule: [{cron: "0 0 * * *"}]   # runs once a day
  workflow_dispatch:                 # adds a manual "Run workflow" button
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-sekiro.svg?palette=github-dark&color_snake=#c9a227&color_dots=#161b22,#3b0a0a,#6b0f0f,#a01515,#e02424
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
