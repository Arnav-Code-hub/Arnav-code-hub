name: Snake
on:
  schedule: [{cron: "0 0 * * *"}]   # runs once a day
  workflow_dispatch:                 # adds a manual "Run workflow" button
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-matrix.svg?palette=github-dark&color_snake=#00ff41&color_dots=#0d1117,#003b00,#008f11,#00c62b,#00ff41
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
