    <rect x="610" y="2" width="284.5" height="172" rx="10" fill="url(#pcShade)"/>
    <rect x="611" y="3" width="282.5" height="170" rx="9" fill="none" stroke="#3a2a1e" stroke-width="2"/>
      <g transform="translate(732.25 20) scale(1)"><path d="M8 32 L30 10" stroke="#1b1714" stroke-width="3"/><path d="M28 12 L36 4" stroke="#e8e1d4" stroke-width="3"/><path d="M6 28 L12 34" stroke="#a3241b" stroke-width="3"/></g>
      <text x="752.25" y="112" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#1b1714">18</text>
      <text x="752.25" y="146" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" letter-spacing="2" fill="#a3241b">FIERCEST DAY · JUL 2</text>
    </g><g class="pop" style="animation-delay:0.45s">
    <rect x="914.5" y="2" width="284.5" height="172" rx="10" fill="url(#pc)"/>
