    <rect x="914.5" y="2" width="284.5" height="172" rx="10" fill="url(#pcShade)"/>
    <rect x="915.5" y="3" width="282.5" height="170" rx="9" fill="none" stroke="#3a2a1e" stroke-width="2"/>
