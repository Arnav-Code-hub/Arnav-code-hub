      <text x="1056.75" y="112" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#1b1714">11</text>
      <text x="1056.75" y="146" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" letter-spacing="2" fill="#a3241b">LONGEST STREAK</text>
    </g>
</svg>
