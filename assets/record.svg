      <text x="143.25" y="112" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#1b1714">238</text>
      <text x="143.25" y="146" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" letter-spacing="2" fill="#a3241b">SEN · CONTRIBUTIONS</text>
    </g><g class="pop" style="animation-delay:0.15s">
    <rect x="305.5" y="2" width="284.5" height="172" rx="10" fill="url(#pc)"/>
