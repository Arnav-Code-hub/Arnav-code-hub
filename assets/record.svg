    <rect x="306.5" y="3" width="282.5" height="170" rx="9" fill="none" stroke="#3a2a1e" stroke-width="2"/>
      <g transform="translate(427.75 20) scale(1)"><ellipse cx="28.0" cy="20.0" rx="6" ry="4" transform="rotate(90 28.0 20.0)" fill="#c24a62"/><ellipse cx="22.5" cy="27.6" rx="6" ry="4" transform="rotate(162 22.5 27.6)" fill="#c24a62"/><ellipse cx="13.5" cy="24.7" rx="6" ry="4" transform="rotate(234 13.5 24.7)" fill="#c24a62"/><ellipse cx="13.5" cy="15.3" rx="6" ry="4" transform="rotate(306 13.5 15.3)" fill="#c24a62"/><ellipse cx="22.5" cy="12.4" rx="6" ry="4" transform="rotate(378 22.5 12.4)" fill="#c24a62"/><circle cx="20" cy="20" r="3.5" fill="#f4d58a"/></g>
      <text x="447.75" y="112" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="44" font-weight="700" fill="#1b1714">×47</text>
      <text x="447.75" y="146" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12" letter-spacing="2" fill="#a3241b">DAYS OF TRAINING</text>
    </g><g class="pop" style="animation-delay:0.30s">
    <rect x="610" y="2" width="284.5" height="172" rx="10" fill="url(#pc)"/>
