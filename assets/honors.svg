<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 122" width="1200" height="122">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.26  0 0 0 0 0.18  0.9 0 0 0 -0.32"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="13"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.23  1.4 0 0 0 -0.62"/>
    </filter>
    <filter id="ink" x="-10%" y="-40%" width="120%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkFine" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="pc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece3d2"/><stop offset="1" stop-color="#d6c9b2"/></linearGradient>
    <radialGradient id="pcShade" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#3e2f20" stop-opacity="0"/><stop offset="1" stop-color="#3e2f20" stop-opacity="0.35"/></radialGradient>
    <style>
      .pop { opacity: 0; animation: pop .5s ease-out forwards; }
      @keyframes pop { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      
    </style>
  </defs>
<g class="pop" style="animation-delay:0.00s">
    <rect x="1" y="1" width="1198" height="116" rx="10" fill="url(#pc)"/>
    <rect x="1" y="1" width="1198" height="116" rx="10" filter="url(#grain)" opacity="0.45"/>
    <rect x="1" y="1" width="1198" height="116" rx="10" fill="url(#pcShade)"/>
    <rect x="2" y="2" width="1196" height="114" rx="9" fill="none" stroke="#3a2a1e" stroke-width="2"/>
      <rect x="24" y="22" width="72" height="72" rx="8" fill="#efe6d6" stroke="#1b1714" stroke-width="2"/>
      <g transform="translate(36 34) scale(1.2)"><rect x="6" y="6" width="28" height="28" rx="4" fill="#b3261e"/><rect x="10" y="10" width="20" height="20" rx="2" fill="none" stroke="#efe6d6" stroke-width="1.4"/></g>
      <text x="120" y="50" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" letter-spacing="3" fill="#1b1714">WEBVERSE HACKATHON</text>
      <text x="120" y="74" font-family="Georgia,'Times New Roman',serif" font-size="15" letter-spacing="1" fill="#6b4a2f">2nd Place · Modern College</text>
      <text x="120" y="98" font-family="Georgia,'Times New Roman',serif" font-size="14" font-style="italic" fill="#3a302a">Placed second at the Webverse hackathon organised by Modern College.</text>
      <g>
        
        <rect x="1116" y="26" width="60" height="28" fill="#c9a227" stroke="#1b1714" stroke-width="1.5" filter="url(#inkFine)"/>
        <text x="1146" y="45" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" letter-spacing="3" fill="#1b1714">2ND</text>
      </g>
    </g>
</svg>
