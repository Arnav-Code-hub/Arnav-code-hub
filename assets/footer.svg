  <defs>
    <clipPath id="frame"><rect width="1200" height="220" rx="14"/></clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cf"/>
      <stop offset="1" stop-color="#d8ccb6"/>
    </linearGradient>
    <radialGradient id="burn" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.5" stop-color="#5a4632" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a4632" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="groundMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4dac8" stop-opacity="0"/>
      <stop offset="1" stop-color="#e4dac8" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="mistPuff">
      <stop offset="0" stop-color="#ece4d5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ece4d5" stop-opacity="0"/>
    </radialGradient>
    
    
    
    
    
    <style>
      .mist { animation: drift 44s linear infinite; }
      .wind { animation: wind linear infinite; }
      .breathe { animation: breathe 7s ease-in-out infinite; }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-1200px) } }
      @keyframes breathe { 0%,100% { opacity: .85 } 50% { opacity: 1 } }
      @keyframes wind {
        0% { transform: translate(0,0) rotate(0deg); opacity: 0 }
        8% { opacity: 1 }
        92% { opacity: 1 }
        100% { transform: translate(-1360px,90px) rotate(-700deg); opacity: 0 }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  <pattern id="grainPat" patternUnits="userSpaceOnUse" width="96" height="96"><image width="96" height="96" href="data:image/png;base64,"/></pattern><pattern id="stainPat" patternUnits="userSpaceOnUse" width="640" height="420"><rect width="640" height="420" fill="none"/>
