<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">
  <defs>
    <clipPath id="frame"><rect width="1200" height="220" rx="14"/></clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cf"/>
      <stop offset="1" stop-color="#d8ccb6"/>
    </linearGradient>
    <radialGradient id="burn" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.5" stop-color="#5a4632" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a4632" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="groundMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4dac8" stop-opacity="0"/>
      <stop offset="1" stop-color="#e4dac8" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="mistPuff">
      <stop offset="0" stop-color="#ece4d5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ece4d5" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.26  0 0 0 0 0.18  0.9 0 0 0 -0.32"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="21"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  1.4 0 0 0 -0.62"/>
    </filter>
    <filter id="ink" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkFine" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wash" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.3"/>
    </filter>
    <style>
      .mist { animation: drift 44s linear infinite; }
      .wind { animation: wind linear infinite; }
      .breathe { animation: breathe 7s ease-in-out infinite; }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-1200px) } }
      @keyframes breathe { 0%,100% { opacity: .85 } 50% { opacity: 1 } }
      @keyframes wind {
        0% { transform: translate(0,0) rotate(0deg); opacity: 0 }
        8% { opacity: 1 }
        92% { opacity: 1 }
        100% { transform: translate(-1360px,90px) rotate(-700deg); opacity: 0 }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="220" fill="url(#paper)"/>
    <rect width="1200" height="220" filter="url(#stain)" opacity="0.5"/>

    <circle class="breathe" cx="1010" cy="92" r="52" fill="#b3261e" filter="url(#ink)"/>

    <path filter="url(#wash)" fill="#9e968a" opacity="0.55"
          d="M-20 160 Q90 120 190 146 Q300 108 410 144 Q520 116 640 152 Q760 122 880 150 Q1000 118 1220 146 L1220 240 L-20 240Z"/>
    <g fill="#857d70" opacity="0.85" filter="url(#inkFine)" transform="translate(-60 -40)">
      <rect x="1040" y="160" width="40" height="30"/>
      <path d="M1026 164 Q1035 159 1040 152 L1080 152 Q1085 159 1094 164Z"/>
      <rect x="1048" y="140" width="24" height="14"/>
      <path d="M1036 143 Q1044 138 1048 132 L1072 132 Q1076 138 1084 143Z"/>
      <path d="M1050 134 L1060 120 L1070 134Z"/>
    </g>
    <g class="mist">
      <ellipse cx="200" cy="168" rx="260" ry="30" fill="url(#mistPuff)"/>
      <ellipse cx="760" cy="176" rx="300" ry="32" fill="url(#mistPuff)"/>
      <ellipse cx="1400" cy="168" rx="260" ry="30" fill="url(#mistPuff)"/>
      <ellipse cx="1960" cy="176" rx="300" ry="32" fill="url(#mistPuff)"/>
    </g>
    <rect y="130" width="1200" height="90" fill="url(#groundMist)"/>

    <text x="560" y="98" text-anchor="middle" font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif"
          font-size="34" font-weight="700" letter-spacing="11" fill="#1b1714" filter="url(#inkFine)">HESITATION IS DEFEAT</text>
    <text x="560" y="130" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13"
          letter-spacing="6" fill="#a8261c">THANKS FOR VISITING, WANDERER</text>

    <g fill="#b3261e">
      <g transform="translate(1230,40)"><path class="wind" style="animation-duration:12s;animation-delay:-3s" d="M0 0 Q7 -3.5 14 0 Q7 3.5 0 0Z"/></g>
      <g transform="translate(1230,90)"><path class="wind" style="animation-duration:15s;animation-delay:-8s" d="M0 0 Q6 -3 12 0 Q6 3 0 0Z"/></g>
      <g transform="translate(1230,20)"><path class="wind" style="animation-duration:13s;animation-delay:-11s" d="M0 0 Q5 -2.5 10 0 Q5 2.5 0 0Z"/></g>
      <g transform="translate(1230,120)"><path class="wind" style="animation-duration:16s;animation-delay:-5s" d="M0 0 Q6 -3 12 0 Q6 3 0 0Z"/></g>
    </g>

    <rect width="1200" height="220" filter="url(#grain)" opacity="0.5"/>
    <rect width="1200" height="220" fill="url(#burn)"/>
  </g>
</svg>
