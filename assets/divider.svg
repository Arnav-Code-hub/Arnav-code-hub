<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <filter id="ink" x="-5%" y="-100%" width="110%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="left"><rect x="600" y="0" width="0" height="60">
      <animate attributeName="x" from="600" to="80" dur="1s" fill="freeze" calcMode="spline" keySplines="0.7 0 0.25 1"/>
      <animate attributeName="width" from="0" to="520" dur="1s" fill="freeze" calcMode="spline" keySplines="0.7 0 0.25 1"/>
    </rect></clipPath>
    <clipPath id="right"><rect x="600" y="0" width="0" height="60">
      <animate attributeName="width" from="0" to="520" dur="1s" fill="freeze" calcMode="spline" keySplines="0.7 0 0.25 1"/>
    </rect></clipPath>
  </defs>

  <!-- Brush strokes sweeping out from the seal -->
  <path clip-path="url(#left)" filter="url(#ink)" fill="#b3261e"
        d="M584 28 C480 25 300 26 100 30 C92 30 90 33 100 34 C300 36 480 35 584 33Z"/>
  <path clip-path="url(#right)" filter="url(#ink)" fill="#b3261e"
        d="M616 28 C720 25 900 26 1100 30 C1108 30 1110 33 1100 34 C900 36 720 35 616 33Z"/>

  <!-- Seal in the centre -->
  <g transform="translate(600 30) rotate(-6)">
    <rect x="-13" y="-13" width="26" height="26" rx="3" fill="#b3261e" filter="url(#ink)">
      <animate attributeName="opacity" values="1;0.7;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-9" y="-9" width="18" height="18" rx="1.5" fill="none" stroke="#efe6d6" stroke-width="1.2" opacity="0.85"/>
  </g>

  <!-- Petal drifting across -->
  <path fill="#c4382b" d="M0 0 Q5 -2.5 10 0 Q5 2.5 0 0Z" opacity="0">
    <animateMotion path="M1150 18 C900 6 700 40 450 22 C300 12 150 36 40 26" dur="7s" begin="1.2s;p.end+2s" id="p" rotate="auto"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" begin="1.2s;p.end+2s"/>
  </path>
</svg>
