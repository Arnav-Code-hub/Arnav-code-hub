<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.26  0 0 0 0 0.18  0.9 0 0 0 -0.32"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="13"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.23  1.4 0 0 0 -0.62"/>
    </filter>
    <filter id="ink" x="-10%" y="-40%" width="120%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkFine" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3e29"/>
      <stop offset="1" stop-color="#2f2017"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3a6"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <style>
      .node { animation: node 2.4s ease-in-out infinite; }
      @keyframes node { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
    </style>
  </defs>

  <!-- Plaque swinging gently on its ropes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-0.9 143 0;0.9 143 0;-0.9 143 0" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <g stroke="#8a6a48" stroke-width="2.2" stroke-linecap="round">
      <line x1="60" y1="0" x2="60" y2="26"/>
      <line x1="226" y1="0" x2="226" y2="26"/>
    </g>
    <rect x="24" y="24" width="238" height="72" rx="5" fill="url(#wood)" filter="url(#inkFine)"/>
    <g stroke="#6e4f36" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M34 40 Q143 34 252 42"/>
      <path d="M38 80 Q143 86 250 78"/>
    </g>
    <rect x="30" y="30" width="226" height="60" rx="3" fill="none" stroke="#c9a227" stroke-opacity="0.55" stroke-width="1.4"/>
    <g fill="#c9a227">
      <circle cx="60" cy="30" r="3"/><circle cx="226" cy="30" r="3"/>
    </g>
    <text x="144.5" y="72.5" text-anchor="middle" font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif" font-size="34" font-weight="700" letter-spacing="6" fill="#120d09" opacity="0.8">ORIGIN</text>
    <text x="143" y="71" text-anchor="middle" font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif" font-size="34" font-weight="700" letter-spacing="6" fill="url(#goldText)">ORIGIN</text>
  </g>

  <!-- Vermilion subtitle tag -->
  <rect x="288" y="45" width="128" height="28" fill="#a3241b" filter="url(#inkFine)"/>
  <text x="352" y="64" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" letter-spacing="4" fill="#efe6d6">WHO I AM</text>

  <!-- Brush line with petals drifting along it -->
  <path filter="url(#ink)" fill="#b3261e" opacity="0.9"
        d="M438 57 C558 55 970 56 1090 58 L1090 61 C970 60 558 61 438 61Z"/>
  <path d="M0 0 Q5.5 -2.75 11 0 Q5.5 2.75 0 0Z" fill="#c4382b" opacity="0">
    <animateMotion path="M1090 50 C890 40 638 66 438 52" dur="7.8s" begin="0s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="7.8s" begin="0s" repeatCount="indefinite"/>
  </path>
  <path d="M0 0 Q5.5 -2.75 11 0 Q5.5 2.75 0 0Z" fill="#c4382b" opacity="0">
    <animateMotion path="M1090 50 C890 40 638 66 438 52" dur="7.8s" begin="2.6s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="7.8s" begin="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M0 0 Q5.5 -2.75 11 0 Q5.5 2.75 0 0Z" fill="#c4382b" opacity="0">
    <animateMotion path="M1090 50 C890 40 638 66 438 52" dur="7.8s" begin="5.2s" repeatCount="indefinite" rotate="auto"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="7.8s" begin="5.2s" repeatCount="indefinite"/>
  </path>

  <!-- Resurrection nodes -->
  <circle class="node" cx="1118" cy="59" r="7" fill="#b3261e"/>
  <circle class="node" style="animation-delay:-0.8s" cx="1142" cy="59" r="7" fill="#b3261e"/>
  <circle cx="1166" cy="59" r="7" fill="none" stroke="#b3261e" stroke-width="1.8"/>
</svg>
