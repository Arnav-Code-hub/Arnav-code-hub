<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <clipPath id="frame"><rect width="1200" height="420" rx="14"/></clipPath>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0cf"/>
      <stop offset="1" stop-color="#d8ccb6"/>
    </linearGradient>
    <radialGradient id="burn" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.55" stop-color="#5a4632" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a4632" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="groundMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4dac8" stop-opacity="0"/>
      <stop offset="1" stop-color="#e4dac8" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sunLight" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d4553f"/>
      <stop offset="1" stop-color="#a8261c"/>
    </radialGradient>
    <radialGradient id="mistPuff">
      <stop offset="0" stop-color="#ece4d5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ece4d5" stop-opacity="0"/>
    </radialGradient>

    <!-- Paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.26  0 0 0 0 0.18  0.9 0 0 0 -0.32"/>
    </filter>
    <!-- Large blotchy stains -->
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  1.4 0 0 0 -0.62"/>
    </filter>
    <!-- Rough ink edge -->
    <filter id="ink" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkFine" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wash" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>

    <clipPath id="strokeReveal">
      <rect x="360" y="190" width="0" height="110">
        <animate attributeName="width" from="0" to="720" dur="1.1s" begin="1s" fill="freeze" calcMode="spline" keySplines="0.7 0 0.25 1"/>
      </rect>
    </clipPath>
    <clipPath id="nameReveal">
      <rect x="340" y="100" width="0" height="110">
        <animate attributeName="width" from="0" to="760" dur="1.3s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.6 0 0.2 1"/>
      </rect>
    </clipPath>

    <style>
      .sun { animation: breathe 7s ease-in-out infinite; }
      .mist { animation: drift 60s linear infinite; }
      .mist2 { animation: drift 38s linear infinite; }
      .wind { animation: wind linear infinite; }
      .fall { animation: fall linear infinite; }
      .sway { animation: sway 6s ease-in-out infinite; transform-origin: 1100px 70px; }
      @keyframes breathe { 0%,100% { opacity: .88 } 50% { opacity: 1 } }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-1200px) } }
      @keyframes sway { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(-1.4deg) } }
      @keyframes wind {
        0% { transform: translate(0,0) rotate(0deg); opacity: 0 }
        6% { opacity: 1 }
        92% { opacity: 1 }
        100% { transform: translate(-1380px,190px) rotate(-760deg); opacity: 0 }
      }
      @keyframes fall {
        0% { transform: translate(0,0) rotate(0deg); opacity: 0 }
        8% { opacity: 1 }
        90% { opacity: 1 }
        100% { transform: translate(-220px,460px) rotate(540deg); opacity: 0 }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Parchment -->
    <rect width="1200" height="420" fill="url(#paper)"/>
    <rect width="1200" height="420" filter="url(#stain)" opacity="0.55"/>

    <!-- Vermilion sun -->
    <g class="sun">
      <circle cx="285" cy="172" r="118" fill="url(#sunLight)" filter="url(#ink)"/>
      <circle cx="285" cy="172" r="118" filter="url(#grain)" opacity="0.35"/>
    </g>

    <!-- Far mountains (ink wash) -->
    <path filter="url(#wash)" fill="#9e968a" opacity="0.55"
          d="M-20 300 Q80 238 170 276 Q250 214 350 262 Q460 222 560 280 Q660 240 760 286 Q870 246 980 282 Q1090 250 1220 276 L1220 440 L-20 440Z"/>

    <!-- Distant pagodas -->
    <g fill="#857d70" opacity="0.8" filter="url(#inkFine)" transform="translate(-850 92)">
      <rect x="1020" y="216" width="80" height="32"/>
      <path d="M1000 220 Q1013 214 1020 204 L1100 204 Q1107 214 1120 220Z"/>
      <rect x="1032" y="186" width="56" height="20"/>
      <path d="M1015 189 Q1026 183 1032 175 L1088 175 Q1094 183 1105 189Z"/>
      <rect x="1042" y="161" width="36" height="16"/>
      <path d="M1027 164 Q1037 158 1042 151 L1078 151 Q1083 158 1093 164Z"/>
      <path d="M1044 153 L1060 132 L1076 153Z"/>
      <rect x="1059" y="110" width="2" height="24"/>
    </g>
    <g fill="#958d80" opacity="0.6" filter="url(#inkFine)" transform="translate(-960 150) scale(1)">
      <rect x="1040" y="190" width="40" height="40"/>
      <path d="M1028 194 Q1036 189 1040 182 L1080 182 Q1084 189 1092 194Z"/>
      <path d="M1046 184 L1060 166 L1074 184Z"/>
    </g>
    <rect x="40" y="250" width="1.6" height="110" fill="#857d70" opacity="0.6"/>

    <!-- Mist drifting through the valley -->
    <g class="mist">
      <ellipse cx="150" cy="318" rx="240" ry="34" fill="url(#mistPuff)"/>
      <ellipse cx="620" cy="300" rx="280" ry="30" fill="url(#mistPuff)"/>
      <ellipse cx="1040" cy="322" rx="240" ry="34" fill="url(#mistPuff)"/>
      <ellipse cx="1350" cy="318" rx="240" ry="34" fill="url(#mistPuff)"/>
      <ellipse cx="1820" cy="300" rx="280" ry="30" fill="url(#mistPuff)"/>
      <ellipse cx="2240" cy="322" rx="240" ry="34" fill="url(#mistPuff)"/>
    </g>

    <!-- Near hills -->
    <path filter="url(#wash)" fill="#6f675b" opacity="0.45"
          d="M-20 362 Q140 318 300 346 Q440 306 580 350 Q720 320 860 356 Q1000 326 1220 350 L1220 440 L-20 440Z"/>
    <rect y="290" width="1200" height="130" fill="url(#groundMist)"/>

    <!-- Lone shinobi on the ridge, scarf streaming in the wind -->
    <g transform="translate(-110 34) translate(600 356) scale(1.25) translate(-600 -356)">
      <path fill="#a8261c" filter="url(#inkFine)">
        <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
          values="M596 290 Q578 286 562 291 Q546 297 528 290 Q540 298 552 300 Q570 301 584 296 Q591 295 597 296Z;
                  M596 290 Q578 294 562 288 Q546 282 528 287 Q539 293 551 294 Q569 297 584 297 Q591 297 597 296Z;
                  M596 290 Q578 286 562 291 Q546 297 528 290 Q540 298 552 300 Q570 301 584 296 Q591 295 597 296Z"/>
      </path>
      <g fill="#1b1714" filter="url(#inkFine)">
        <path d="M583 356 L589 314 L613 314 L619 356Z"/>
        <path d="M587 316 Q585 297 592 289 L610 289 Q617 297 615 316Z"/>
        <circle cx="601" cy="280" r="8.2"/>
        <path d="M591 279 L587 270 L594 273 L595 265 L601 271 L605 264 L608 272 L615 268 L611 279Z"/>
      </g>
      <line x1="587" y1="270" x2="621" y2="324" stroke="#1b1714" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="587" y1="270" x2="595" y2="283" stroke="#a8261c" stroke-width="1.2" stroke-dasharray="1.5 1.5"/>
    </g>

    <g class="mist2" opacity="0.8">
      <ellipse cx="300" cy="388" rx="320" ry="30" fill="url(#mistPuff)"/>
      <ellipse cx="900" cy="396" rx="340" ry="32" fill="url(#mistPuff)"/>
      <ellipse cx="1500" cy="388" rx="320" ry="30" fill="url(#mistPuff)"/>
      <ellipse cx="2100" cy="396" rx="340" ry="32" fill="url(#mistPuff)"/>
    </g>

    <!-- Weathered wooden post and crossbeam -->
    <g fill="#2a231e" filter="url(#ink)">
      <path d="M1098 -10 L1146 -10 L1150 440 L1094 440Z"/>
      <path d="M1040 34 L1210 28 L1210 48 L1044 52Z"/>
    </g>
    <g stroke="#2a231e" stroke-linecap="round" opacity="0.75">
      <line x1="1060" y1="50" x2="1060" y2="78" stroke-width="2"/>
      <line x1="1072" y1="50" x2="1072" y2="64" stroke-width="1.4"/>
      <line x1="1170" y1="46" x2="1170" y2="92" stroke-width="1.8"/>
    </g>
    <g stroke="#e3d8c4" stroke-width="1.2" opacity="0.25">
      <line x1="1108" y1="70" x2="1110" y2="420"/>
      <line x1="1128" y1="0" x2="1131" y2="300"/>
    </g>

    <!-- Tattered cloth strips tied to the crossbeam -->
    <path fill="#1b1714" filter="url(#inkFine)" opacity="0.9">
      <animate attributeName="d" dur="3s" repeatCount="indefinite"
        values="M1186 44 L1194 44 Q1190 80 1176 110 Q1168 128 1150 140 Q1166 118 1172 100 Q1180 76 1186 44Z;
                M1186 44 L1194 44 Q1186 82 1168 106 Q1156 122 1138 128 Q1156 112 1164 96 Q1176 74 1186 44Z;
                M1186 44 L1194 44 Q1190 80 1176 110 Q1168 128 1150 140 Q1166 118 1172 100 Q1180 76 1186 44Z"/>
    </path>
    <path fill="#a8261c" filter="url(#inkFine)">
      <animate attributeName="d" dur="2.6s" repeatCount="indefinite"
        values="M1198 42 L1204 42 Q1200 70 1188 92 Q1180 104 1166 110 Q1180 96 1186 82 Q1194 64 1198 42Z;
                M1198 42 L1204 42 Q1198 72 1182 90 Q1172 100 1156 102 Q1172 92 1180 78 Q1192 62 1198 42Z;
                M1198 42 L1204 42 Q1200 70 1188 92 Q1180 104 1166 110 Q1180 96 1186 82 Q1194 64 1198 42Z"/>
    </path>

    <!-- Cherry branch (sways in the wind) -->
    <g class="sway">
      <g fill="none" stroke="#2a231e" stroke-linecap="round" filter="url(#inkFine)">
        <path d="M1100 72 Q1030 70 980 54 Q930 38 870 44" stroke-width="5"/>
        <path d="M980 54 Q960 26 935 18" stroke-width="2.6"/>
        <path d="M920 42 Q900 64 878 70" stroke-width="2.4"/>
        <path d="M1030 66 Q1018 88 996 98" stroke-width="2.2"/>
        <path d="M870 44 Q845 46 822 36" stroke-width="2"/>
      </g>
      <g fill="#b3261e">
        <circle cx="935" cy="18" r="4"/><circle cx="943" cy="22" r="3"/><circle cx="928" cy="24" r="3"/>
        <circle cx="878" cy="70" r="4"/><circle cx="870" cy="65" r="3"/><circle cx="884" cy="76" r="2.6"/>
        <circle cx="996" cy="98" r="4"/><circle cx="1004" cy="94" r="3"/><circle cx="990" cy="104" r="2.6"/>
        <circle cx="822" cy="36" r="3.6"/><circle cx="814" cy="40" r="2.6"/><circle cx="828" cy="30" r="2.4"/>
        <circle cx="960" cy="48" r="3"/><circle cx="1050" cy="68" r="3"/><circle cx="905" cy="40" r="2.6"/>
      </g>
    </g>

    <!-- Name -->
    <g clip-path="url(#nameReveal)">
      <text x="715" y="182" text-anchor="middle" font-family="'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif"
            font-size="56" font-weight="700" letter-spacing="13" fill="#1b1714" filter="url(#inkFine)">ARNAV AGARWAL</text>
    </g>

    <!-- Sumi brush stroke with subtitle -->
    <g clip-path="url(#strokeReveal)">
      <path fill="#1b1714" filter="url(#ink)"
            d="M372 222 C470 210 700 206 1040 214 C1062 216 1066 236 1046 242 C900 254 640 258 470 256 C430 256 396 254 380 250 C360 246 356 226 372 222Z"/>
      <g stroke="#d8ccb6" stroke-width="1" opacity="0.35" fill="none">
        <path d="M420 228 C600 222 820 220 1010 224"/>
        <path d="M460 247 C640 246 860 244 1000 240"/>
      </g>
      <text x="712" y="240" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="16"
            letter-spacing="9" fill="#efe6d6">SHINOBI · OF · CODE</text>
    </g>

    <!-- Hanko seal -->
    <g transform="translate(1022 252) rotate(-6)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1.6;0.94;1" keyTimes="0;0.7;1" dur="0.35s" begin="2.2s" fill="freeze"/>
      <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#b3261e" filter="url(#ink)"/>
      <rect x="-17" y="-17" width="34" height="34" rx="2" fill="none" stroke="#efe6d6" stroke-width="1.4" opacity="0.85"/>
      <text x="0" y="7" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="18" font-weight="700" fill="#efe6d6">AA</text>
    </g>

    <!-- Ink splatters -->
    <g fill="#1b1714" filter="url(#inkFine)">
      <circle cx="350" cy="262" r="3"/><circle cx="342" cy="270" r="1.6"/><circle cx="1066" cy="206" r="2.4"/>
      <circle cx="1078" cy="222" r="1.4"/><circle cx="560" cy="268" r="1.2"/><circle cx="890" cy="200" r="1.3"/>
    </g>
    <g fill="#b3261e">
      <circle cx="120" cy="60" r="2.2"/><circle cx="470" cy="40" r="1.6"/><circle cx="760" cy="92" r="1.8"/>
      <circle cx="610" cy="300" r="1.4"/><circle cx="230" cy="330" r="2"/>
    </g>

    <!-- Petals carried on the wind -->
    <g fill="#b3261e">
      <g transform="translate(1230,60)"><path class="wind" style="animation-duration:13s;animation-delay:-2s" d="M0 0 Q7 -3.5 14 0 Q7 3.5 0 0Z"/></g>
      <g transform="translate(1230,120)"><path class="wind" style="animation-duration:16s;animation-delay:-9s" d="M0 0 Q6 -3 12 0 Q6 3 0 0Z"/></g>
      <g transform="translate(1230,30)"><path class="wind" style="animation-duration:12s;animation-delay:-5s" d="M0 0 Q7 -3.5 14 0 Q7 3.5 0 0Z"/></g>
      <g transform="translate(1230,180)"><path class="wind" style="animation-duration:15s;animation-delay:-12s" d="M0 0 Q5 -2.5 10 0 Q5 2.5 0 0Z"/></g>
      <g transform="translate(1230,90)"><path class="wind" style="animation-duration:18s;animation-delay:-4s" d="M0 0 Q6 -3 12 0 Q6 3 0 0Z"/></g>
      <g transform="translate(1230,150)"><path class="wind" style="animation-duration:14s;animation-delay:-7s" d="M0 0 Q7 -3.5 14 0 Q7 3.5 0 0Z"/></g>
      <g transform="translate(1230,10)"><path class="wind" style="animation-duration:17s;animation-delay:-14s" d="M0 0 Q5 -2.5 10 0 Q5 2.5 0 0Z"/></g>
      <g transform="translate(1230,220)"><path class="wind" style="animation-duration:13.5s;animation-delay:-10s" d="M0 0 Q6 -3 12 0 Q6 3 0 0Z"/></g>
    </g>
    <g fill="#c4382b">
      <g transform="translate(940,40)"><path class="fall" style="animation-duration:11s;animation-delay:-3s" d="M0 0 Q4 -4 8 0 Q4 4 0 0Z"/></g>
      <g transform="translate(880,70)"><path class="fall" style="animation-duration:9s;animation-delay:-6s" d="M0 0 Q4 -4 8 0 Q4 4 0 0Z"/></g>
      <g transform="translate(1000,95)"><path class="fall" style="animation-duration:12s;animation-delay:-1s" d="M0 0 Q4 -4 8 0 Q4 4 0 0Z"/></g>
      <g transform="translate(825,36)"><path class="fall" style="animation-duration:10s;animation-delay:-8s" d="M0 0 Q4 -4 8 0 Q4 4 0 0Z"/></g>
    </g>

    <!-- Grain and burnt edges over everything -->
    <rect width="1200" height="420" filter="url(#grain)" opacity="0.5"/>
    <rect width="1200" height="420" fill="url(#burn)"/>
  </g>
</svg>
