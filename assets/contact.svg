<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.33  0 0 0 0 0.26  0 0 0 0 0.18  0.9 0 0 0 -0.32"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="13"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.23  1.4 0 0 0 -0.62"/>
    </filter>
    <filter id="ink" x="-10%" y="-40%" width="120%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="inkFine" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="pc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece3d2"/><stop offset="1" stop-color="#d6c9b2"/></linearGradient>
    <radialGradient id="pcShade" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#3e2f20" stop-opacity="0"/><stop offset="1" stop-color="#3e2f20" stop-opacity="0.35"/></radialGradient>
    <style>
      .pop { opacity: 0; animation: pop .5s ease-out forwards; }
      @keyframes pop { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
      
    </style>
  </defs>

    <rect x="1" y="1" width="1198" height="208" rx="10" fill="url(#pc)"/>
    <rect x="1" y="1" width="1198" height="208" rx="10" filter="url(#grain)" opacity="0.45"/>
    <rect x="1" y="1" width="1198" height="208" rx="10" fill="url(#pcShade)"/>
    <rect x="2" y="2" width="1196" height="206" rx="9" fill="none" stroke="#3a2a1e" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.4s" repeatCount="indefinite"/>
      <g transform="translate(60 40)">
        <path fill="#1b1714">
          <animate attributeName="d" dur="0.7s" repeatCount="indefinite" values="M20 70 C40 40 70 30 96 36 L60 10 C90 14 112 26 124 42 L150 34 L138 50 C150 56 158 66 158 74 C140 68 126 70 114 78 L104 96 L98 80 C80 84 50 82 20 70Z;M20 70 C40 56 70 46 96 46 L70 70 C96 70 112 60 124 50 L150 40 L138 56 C150 62 158 70 158 78 C140 72 126 74 114 82 L104 100 L98 84 C80 88 50 86 20 70Z;M20 70 C40 40 70 30 96 36 L60 10 C90 14 112 26 124 42 L150 34 L138 50 C150 56 158 66 158 74 C140 68 126 70 114 78 L104 96 L98 80 C80 84 50 82 20 70Z"/>
        </path>
        <circle cx="140" cy="48" r="2.6" fill="#ff8a2a"/>
        <rect x="86" y="86" width="34" height="16" rx="3" fill="#efe6d6" stroke="#1b1714" stroke-width="1.6" transform="rotate(-10 103 94)"/>
        <rect x="98" y="88" width="10" height="10" fill="#b3261e" transform="rotate(-10 103 93)"/>
      </g>
    </g>
    <text x="300" y="82" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700" letter-spacing="6" fill="#1b1714">SEND A CROW</text>
    <text x="300" y="116" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#3a302a">Open to internships, collaborations and hackathons.</text>
    <text x="300" y="150" font-family="Georgia,'Times New Roman',serif" font-size="14" letter-spacing="2" fill="#a3241b">GITHUB  @Arnav-Code-hub</text>
    <g transform="translate(1060 50)"><path d="M0 0 Q6 -3 12 0 Q6 3 0 0Z" fill="#e88a9c"><animateTransform attributeName="transform" type="rotate" values="0 6 0;30 6 0;0 6 0" dur="3s" repeatCount="indefinite"/></path></g><g transform="translate(1090 80)"><path d="M0 0 Q6 -3 12 0 Q6 3 0 0Z" fill="#c24a62"><animateTransform attributeName="transform" type="rotate" values="0 6 0;30 6 0;0 6 0" dur="4s" repeatCount="indefinite"/></path></g><g transform="translate(1120 50)"><path d="M0 0 Q6 -3 12 0 Q6 3 0 0Z" fill="#e88a9c"><animateTransform attributeName="transform" type="rotate" values="0 6 0;30 6 0;0 6 0" dur="5s" repeatCount="indefinite"/></path></g><g transform="translate(1150 80)"><path d="M0 0 Q6 -3 12 0 Q6 3 0 0Z" fill="#c24a62"><animateTransform attributeName="transform" type="rotate" values="0 6 0;30 6 0;0 6 0" dur="6s" repeatCount="indefinite"/></path></g>
</svg>
